[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cdd"
version = "1.1.3"
description = "Contract-Driven Development spec + tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["contracts", "testing", "spec", "validation"]
dependencies = [
  "pyyaml>=6.0.1",
  "jsonschema>=4.22.0",
  "referencing>=0.35.1",
  "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]
sclang = []

[project.scripts]
cdd = "cdd.cli:main"
contract-lint = "cdd.cli:contract_lint"
contract-test = "cdd.cli:contract_test"
contract-coverage = "cdd.cli:contract_coverage"

[project.entry-points."cdd.executors"]
python = "cdd.executors.python_exec:PythonExecutor"
shell = "cdd.executors.shell_exec:ShellExecutor"
static = "cdd.executors.static_exec:StaticExecutor"
sclang = "cdd.executors.sclang_exec:SclangExecutor"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
